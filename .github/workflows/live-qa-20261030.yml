name: ERP online five-role October 30 acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - qa/live-five-role-full-20261030
    paths:
      - '.github/workflows/live-qa-20261030.yml'
      - 'test/ui/live-full-20261030.js'
      - 'test/ui/survey.js'

permissions:
  contents: read

concurrency:
  group: erp-online-five-role-20261030
  cancel-in-progress: false

jobs:
  live-business-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ERP_BASE: https://erp.aibuild.work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Online API health and deployment availability
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 25 "$ERP_BASE/api/health"
      - name: Execute online five-role business lifecycle and API permission matrix
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/live-regression
          node test/ui/survey.js 2>&1 | tee artifacts/live-regression/online-business-survey.log
          # pipefail returns the actual test status (not tee's exit status).
      - name: Save business regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-live-20261030-business
          path: artifacts/live-regression/
          retention-days: 14
          if-no-files-found: warn

  live-browser-five-role:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ERP_BASE: https://erp.aibuild.work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium browser for Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Execute online five-role page and button interactions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/live-regression
          node test/ui/live-full-20261030.js 2>&1 | tee artifacts/live-regression/online-browser-check.log
          # pipefail returns the actual test status (not tee's exit status).
      - name: Save screenshots and machine-readable failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-live-20261030-browser
          path: artifacts/live-regression/
          retention-days: 14
          if-no-files-found: warn

  live-new-module-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ERP_BASE: https://erp.aibuild.work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API verification dependencies
        run: npm install --no-audit --no-fund
      - name: Check archived PDF live authorization and download
        run: node test/ui/archive-pdf-live.js
      - name: Check invitation templates and permission matrix
        run: node test/ui/prep-invitation-live.js
      - name: Check admin-only project ledger and CSV
        run: node test/ui/project-ledger-live.js
