name: Cloudflare account access audit (read-only)

on:
  push:
    branches:
      - audit/cloudflare-access-20261028

permissions:
  contents: read

jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configured Cloudflare credentials (without exposing secrets)
        shell: bash
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CF_TOKEN_CONFIGURED=no"
            exit 0
          fi
          echo "CF_TOKEN_CONFIGURED=yes"
          if [ -z "$CF_ACCOUNT" ]; then echo "CF_ACCOUNT_ID_CONFIGURED=no"; else echo "CF_ACCOUNT_ID_CONFIGURED=yes"; fi
          curl -sS --max-time 20 -o /tmp/cf-token-check.json \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" || true
          node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/cf-token-check.json","utf8"))}catch{};console.log("CF_TOKEN_VALID="+(x.success===true?"yes":"no"))'
          if [ -n "$CF_ACCOUNT" ]; then
            curl -sS --max-time 20 -o /tmp/cf-workers.json \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" || true
            node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/cf-workers.json","utf8"))}catch{};console.log("CF_WORKERS_READ="+(x.success===true?"yes":"no"));console.log("TARGET_WORKER_VISIBLE="+(Array.isArray(x.result)&&x.result.some(w=>w.id==="erp-workbanch")?"yes":"no"))'
          fi
