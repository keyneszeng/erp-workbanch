name: ERP Cloudflare demo configuration check (never deploy)

# Historical Cloudflare deployment workflow is permanently disabled.
# ERP production must be hosted on Alibaba Cloud ECS, not Workers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-demo-config:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare is exclusively demo and production deploy is blocked
        run: |
          node scripts/check-cloudflare-demo.cjs
          if node scripts/check-production-deploy.cjs; then
            echo "::error::Cloudflare production deployment must be blocked"
            exit 1
          fi
      - name: No deployment performed
        run: echo "Cloudflare demo stays unchanged; no Cloudflare upload or deployment."
