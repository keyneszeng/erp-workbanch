name: ERP QA regression

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - '云服务器测试版本'

permissions:
  contents: read

jobs:
  node-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check key JavaScript syntax
        run: |
          node --check server/api/mini.js
          node --check server/lib/associations.js
          node --check server/lib/verified-payees.js
          node --input-type=module --check < web/assets/js/lib/payee-picker.js
          node --check server/api/mini-applications.js
          node --check miniprogram/pages/apply/index.js
          node --input-type=module --check < web/assets/js/pages/users.js
          node --input-type=module --check < web/assets/js/pages/dashboard.js
          node --input-type=module --check < web/assets/js/pages/project.js
          node --input-type=module --check < web/assets/js/pages/finance.js
          node --input-type=module --check < web/assets/js/pages/materials.js
          node --input-type=module --check < web/assets/js/pages/demand.js
          node --check server/api/projects.js
          node --check server/lib/settlement-breakdown.js
          node --check test/settlement-breakdown.test.js
          node --input-type=module --check < web/assets/js/lib/settlement-breakdown.js
          node --check server/lib/budget-fee.js
          node --input-type=module --check < web/assets/js/pages/projects.js
          node --input-type=module --check < web/assets/js/lib/budget-fee.js
          node --check server/api/project-notice.js
          node --check server/lib/project-notice.js
          node --check miniprogram/app.js
          node --check miniprogram/config.js
          node --check miniprogram/pages/bind/index.js
          node --check miniprogram/pages/home/index.js
          node --check miniprogram/pages/projects/index.js
          node --check miniprogram/pages/project/index.js
          node --check miniprogram/pages/approvals/index.js
          node --check miniprogram/pages/materials/index.js
          node --check miniprogram/pages/account/index.js
          node --check server/api/finance.js
          node --check server/lib/db.js
          node --check test/payment-duplicate.test.js
          node --input-type=module --check < web/assets/js/lib/contract-detail.js
          node --input-type=module --check < web/assets/js/pages/contracts.js
          node --check server/api/verify.js
          node --input-type=module --check < web/assets/js/lib/contract-material-replace.js
          node --input-type=module --check < web/assets/js/pages/materials.js
          node --input-type=module --check < web/assets/js/pages/users.js
          node --check server/lib/meeting-sop.js
          node --check server/lib/labor-contracts.js
          node --input-type=module --check < web/assets/js/lib/labor-contract-preview.js
          node --check miniprogram/pages/materials/index.js
          node --input-type=module --check < web/assets/js/lib/sop-fields.js
          node --input-type=module --check < web/assets/js/lib/verify-detail.js
          node --check server/api/system.js
          node --check server/api/files.js
          node --check server/lib/legacy-office.js
          node --check server/lib/storage.js
          node --input-type=module --check < web/assets/js/pages/verify.js
          node --input-type=module --check < web/assets/js/pages/archive.js
          node --input-type=module --check < web/assets/js/lib/upload.js
          node --input-type=module --check < web/assets/js/lib/income-workbench.js
          node --check server/lib/ocr-engine.js
          node --check server/api/material-workbench.js
          node --check server/lib/archive-pdf.js
          node --check server/api/archive-pdf.js
          node --check server/api/user-access.js
          node --check test/permission-grants.test.js
          node --input-type=module --check < web/assets/js/pages/users.js
          node --input-type=module --check < web/assets/js/lib/nav.js
          node --check server/lib/material-export-pdf.js
          node --input-type=module --check < web/assets/js/lib/archive-pdf.js
          node --input-type=module --check < web/assets/js/lib/api.js
          node --check server/api/prep-invitations.js
          node --check server/api/prep-admin.js
          node --check server/api/project-ledger.js
          node --input-type=module --check < web/assets/js/pages/project-ledger.js
          node --check server/lib/prep-config.js
          node --check server/lib/prep-mail-credentials.js
          node --check server/lib/prep-invitation.js
          node --input-type=module --check < web/assets/js/pages/prep-invitations.js
          node --input-type=module --check < web/assets/js/pages/invitation-config.js
          node --input-type=module --check < web/assets/js/invitation-public.js
          node --check miniprogram/pages/invite/index.js
      - name: Install PDF and Word generation dependencies
        run: npm install --no-audit --no-fund
      - name: Verify per-account grants and zero-rights default before OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/permission-grants.test.js
      - name: Verify material selection and mandatory PDF watermarks before heavy OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/archive-pdf.test.js
      - name: Verify settlement classifications, totals and scoped detail access
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/settlement-breakdown.test.js
      - name: Verify initiation budget tax-fee and available budget before heavy OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/project-tax-fee.test.js
      - name: Verify Word initiation notice workflow before heavy OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/project-notice.test.js
      - name: Verify demand quantities and unit-price totals before OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/demand-pricing.test.js
      - name: Verify signed-review contract replacement and automatic old-file removal
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/contract-replace.test.js
      - name: Verify XLS/DOC/PPT legacy upload, CSV/TXT and download before OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/legacy-office.test.js test/legacy-ppt.test.js test/office-material.test.js
      - name: Verify flexible material gate in real production mode before OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/v1219.test.js
      - name: Verify final agenda confirms on upload with no manual task or speaker form
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/final-agenda-upload.test.js
      - name: Verify first-step stamped document versus host script without sponsor field
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/meeting-sop.test.js
      - name: Verify five-source speaker reconciliation before OCR setup
        run: ERP_DEMO_MODE=1 node --experimental-sqlite --test test/meeting-sop.test.js test/speaker-five-source.test.js test/verify-step4-course-topics.test.js
      - name: Install offline OCR runtime (Tesseract Chinese/English + Poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng poppler-utils
      - name: Run complete API regression
        run: npm test
      - name: Run Cloudflare DO-SQLite compatibility regression
        run: npm run test:cf
      - name: Install headless browser test harness
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright
      - name: "Black-box superadmin per-user access assignment editor"
        run: ERP_DEMO_MODE=1 node test/ui/permission-grants.js
      - name: "Black-box material selection modal, operator watermark and superadmin controls"
        run: ERP_DEMO_MODE=1 node test/ui/material-export.js
      - name: "Black-box settlement summary and clickable category detail"
        run: ERP_DEMO_MODE=1 node test/ui/settlement-breakdown.js
      - name: "Black-box initiation form tax-fee preview"
        run: ERP_DEMO_MODE=1 node test/ui/budget-fee.js
      - name: "Black-box legacy XLS upload from material register"
        run: ERP_DEMO_MODE=1 node test/ui/xls-upload.js
      - name: "Black-box contract sign confirmation and replacement"
        run: ERP_DEMO_MODE=1 node test/ui/contract-detail.js
      - name: "Black-box demand UI: quantity times unit price and archiving"
        run: ERP_DEMO_MODE=1 node test/ui/demand.js
      - name: "Black-box Web UI smoke: workbench, project, materials and finance"
        run: node test/ui/prototype-visual-smoke.js
      - name: Assert Cloudflare demo-only config and blocked production deploy
        run: |
          node scripts/check-cloudflare-demo.cjs
          if node scripts/check-production-deploy.cjs; then
            echo "::error::Production Cloudflare deploy unexpectedly allowed"
            exit 1
          fi
      - name: Verify Cloudflare demo Worker bundle compatibility (dry-run only)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .cf-dist
      - name: Run additional QA authorization suite when present
        if: hashFiles('test/qa-rbac-regression.test.js') != ''
        run: node --experimental-sqlite --test test/qa-rbac-regression.test.js
