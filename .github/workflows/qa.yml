name: ERP QA regression

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check key JavaScript syntax
        run: |
          node --check server/api/projects.js
          node --check server/api/finance.js
          node --check server/api/verify.js
          node --check server/api/system.js
          node --check server/api/files.js
          node --check server/lib/archive-pdf.js
          node --check server/api/archive-pdf.js
          node --check server/api/prep-invitations.js
          node --check server/api/prep-admin.js
          node --check server/api/project-ledger.js
          node --input-type=module --check < web/assets/js/pages/project-ledger.js
          node --check server/lib/prep-config.js
          node --check server/lib/prep-mail-credentials.js
          node --check server/lib/prep-invitation.js
          node --input-type=module --check < web/assets/js/pages/prep-invitations.js
          node --input-type=module --check < web/assets/js/pages/invitation-config.js
          node --input-type=module --check < web/assets/js/invitation-public.js
          node --check miniprogram/pages/invite/index.js
      - name: Install PDF generation dependency
        run: npm install --no-audit --no-fund
      - name: Run complete API regression
        run: npm test
      - name: Assert Cloudflare demo-only config and blocked production deploy
        run: |
          node scripts/check-cloudflare-demo.cjs
          if node scripts/check-production-deploy.cjs; then
            echo "::error::Production Cloudflare deploy unexpectedly allowed"
            exit 1
          fi
      - name: Verify Cloudflare demo Worker bundle compatibility (dry-run only)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .cf-dist
      - name: Run additional QA authorization suite when present
        if: hashFiles('test/qa-rbac-regression.test.js') != ''
        run: node --experimental-sqlite --test test/qa-rbac-regression.test.js
