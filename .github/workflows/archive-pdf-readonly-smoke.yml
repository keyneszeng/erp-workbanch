name: Archived PDF live read-only verification

on:
  push:
    branches:
      - debug/archive-pdf-live-20261028

permissions:
  contents: read

jobs:
  pdf-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/ui/archive-pdf-live.js
