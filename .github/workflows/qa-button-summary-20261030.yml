name: ERP Oct 30 button inventory summary
on:
  push:
    branches:
      - qa/live-five-role-full-20261030
    paths:
      - '.github/workflows/qa-button-summary-20261030.yml'
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous live browser artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 40994111506
          name: erp-live-20261030-browser
          path: proof
          github-token: ${{ github.token }}
      - name: Summarize button instances and status
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('proof/role-button-coverage.json','utf8'));
          console.log('QA_TOTAL',JSON.stringify({pass:d.pass,fail:d.fail,skip:d.skip,pages:d.inventory.length}));
          const perRole={};let total=0;const groups={};
          for(const r of d.inventory){
            const items=r.buttons||[];
            perRole[r.role]??={pages:0,buttons:0,disabled:0};
            perRole[r.role].pages++;perRole[r.role].buttons+=items.length;
            perRole[r.role].disabled+=items.filter(b=>b.disabled).length;
            total+=items.length;
            const titles=items.map(b=>(b.id?"#"+b.id+":" :"")+(b.text||"").replace(/\\s+/g," ").slice(0,35));
            groups[r.role+"/"+r.route]={buttons:items.length,labels:titles};
          }
          console.log('QA_BUTTON_INSTANCES',total);
          console.log('QA_ROLE_BUTTON_COUNTS',JSON.stringify(perRole));
          for(const [k,v] of Object.entries(groups))console.log('QA_ROUTE_BUTTONS',k,JSON.stringify(v));
          const untested=(d.results||[]).filter(x=>x.status==='SKIP'||x.status==='FAIL');
          console.log('QA_UNTESTED_OR_FAILED',JSON.stringify(untested));
          NODE
